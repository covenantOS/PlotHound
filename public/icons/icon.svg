<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Dog silhouette (simplified hound) -->
  <g fill="#ffffff" transform="translate(80, 100)">
    <!-- Body -->
    <ellipse cx="176" cy="200" rx="120" ry="80"/>
    <!-- Head -->
    <circle cx="300" cy="140" r="60"/>
    <!-- Snout -->
    <ellipse cx="350" cy="155" rx="35" ry="25"/>
    <!-- Ear -->
    <ellipse cx="270" cy="90" rx="25" ry="40" transform="rotate(-20, 270, 90)"/>
    <!-- Legs -->
    <rect x="90" y="250" width="25" height="70" rx="10"/>
    <rect x="140" y="250" width="25" height="70" rx="10"/>
    <rect x="210" y="250" width="25" height="70" rx="10"/>
    <rect x="260" y="250" width="25" height="70" rx="10"/>
    <!-- Tail -->
    <path d="M56 180 Q20 140 40 100" stroke="#ffffff" stroke-width="20" fill="none" stroke-linecap="round"/>
    <!-- Eye -->
    <circle cx="310" cy="130" r="8" fill="#7c3aed"/>
    <!-- Nose -->
    <ellipse cx="370" cy="150" rx="12" ry="10" fill="#1a1a1a"/>
  </g>
</svg>
